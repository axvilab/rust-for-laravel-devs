# docker compose up --build             -> API on http://localhost:3000
# docker compose up -d db               -> only Postgres, for a local `cargo run` / `cargo test`
# docker compose run --rm dev           -> cargo test inside rust:1-bookworm (no Rust on the host)
# docker compose run --rm dev cargo clippy --all-targets -- -D warnings
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: orders-api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:pg@db:5432/orders
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RUST_LOG: info,sqlx=warn
      LOG_JSON: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s # graceful shutdown: let in-flight requests finish

  # Toolchain in a container: the repo is mounted, the build cache lives in volumes.
  dev:
    image: rust:1-bookworm
    profiles: ["dev"]
    working_dir: /work/orders-api
    volumes:
      - ..:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/work/target
    environment:
      # #[sqlx::test] creates a throwaway database per test on this server
      DATABASE_URL: postgres://postgres:pg@db:5432/postgres
      JWT_SECRET: dev
    depends_on:
      db:
        condition: service_healthy
    command: ["cargo", "test"]

volumes:
  pgdata:
  cargo-registry:
  cargo-target:
