[workspace]
resolver = "3"
members = [
    "orders-api",
    "chapters/01-basics",
    "chapters/02-control",
    "chapters/03-functions",
    "chapters/04-structs",
    "chapters/05-enums",
    "chapters/06-concept",
    "chapters/07-traits",
    "chapters/08-ownership",
    "chapters/09-borrowing",
]

[workspace.package]
edition = "2024"
rust-version = "1.88" # let chains (розділ 2) стабільні з 1.88
license = "MIT"
publish = false

# Chapter crates opt in with `[lints] workspace = true`.
# Book examples are fragments: a struct field that is only printed via `{:?}`
# counts as "never read", so dead_code would be pure noise here.
[workspace.lints.rust]
dead_code = "allow"

# Profiles are honoured only in the workspace root manifest.
[profile.release]
lto = true          # cross-crate optimisation: smaller and faster binary
codegen-units = 1   # slower build, faster code
strip = true        # drop debug symbols
# panic = "abort" is deliberately NOT set: with unwinding, a panic in one
# handler kills only that request's task; with "abort" it kills the server.
