[workspace]
resolver = "3"
members = [
    "orders-api",
    "chapters/01-basics",
    "chapters/02-control",
    "chapters/03-functions",
    "chapters/04-structs",
    "chapters/05-enums",
    "chapters/06-concept",
    "chapters/07-traits",
    "chapters/08-ownership",
    "chapters/09-borrowing",
    "chapters/10-lifetimes",
    "chapters/11-collections",
    "chapters/12-errors",
    "chapters/13-generics",
    "chapters/14-modules",
    "chapters/15-threads",
    "chapters/16-async",
    "chapters/17-tests",
]

[workspace.package]
edition = "2024"
rust-version = "1.88" # let chains (chapter 2) are stable since 1.88
license = "MIT"
publish = false

# Shared versions for chapter crates (same as orders-api, so Cargo.lock has one copy).
[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "0.9"

# Chapter crates opt in with `[lints] workspace = true`.
# Book examples are fragments: a struct field that is only printed via `{:?}`
# counts as "never read", so dead_code would be pure noise here.
[workspace.lints.rust]
dead_code = "allow"

# Profiles are honoured only in the workspace root manifest.
[profile.release]
lto = true          # cross-crate optimisation: smaller and faster binary
codegen-units = 1   # slower build, faster code
strip = true        # drop debug symbols
# panic = "abort" is deliberately NOT set: with unwinding, a panic in one
# handler kills only that request's task; with "abort" it kills the server.
